<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sintaxe do CSS</title>
</head>
<body>
    <header>
        <h1>Formulário de Login</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
        <hr>
    </header>

    <form action="">
        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" name="usuario" required>
        <br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
        <br>
        
        <button type="submit" class="btn">Entrar</button>
        <button type="reset" class="btn">Limpar</button>
        <button type="button" class="btn" onclick="window.location.href='cadastro.html'">Cadastrar</button>
        <button type="button" class="btn-esq" onclick="window.location.href='esqueci_senha.html'">Esqueci a Senha</button>
    </form>
</body>
</html>
